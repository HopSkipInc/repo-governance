name: issue-routing

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check issue routing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The installed copy, not templates/ — this repo goes through the same
        # install path a client does, so CI exercises what clients actually run
        # and this repo can tune its own SEVERITY without editing what ships.
        run: node scripts/check-issue-routing.mjs
