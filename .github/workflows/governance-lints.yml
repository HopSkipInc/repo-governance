name: governance-lints

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Rule 3 diffs against a base ref and reads file content at that ref.
          # A shallow clone has neither.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve base ref
        id: base
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A first push to a branch, or a force-push, can yield an unusable ref.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"
      - name: Check template versions
        run: |
          if [ -n "${{ steps.base.outputs.ref }}" ]; then
            node scripts/check-template-versions.mjs --base "${{ steps.base.outputs.ref }}"
          else
            # No usable base — rules 1-2 still run, and we say so rather than
            # reporting a pass that quietly skipped the rule that matters.
            echo "::warning::No usable base ref; rule 3 (version bump on change) did not run."
            node scripts/check-template-versions.mjs
          fi
      - name: Test the lints
        # This repo's coverage floor is a rule, not a percentage: every script in
        # scripts/ fires on a known-bad input and clears on a known-good one. Two
        # lint bugs have shipped here, both of the only kind that matters — a
        # check that quietly stopped checking, indistinguishable in CI from one
        # that passed. See docs/testing-strategy.md.
        run: node --test 'test/*.test.mjs'

      - name: Check blank-form naming
        # A blank form in a records directory gets read as a record — twice here,
        # by two different readers, from the same root cause.
        run: node scripts/check-blank-form-naming.mjs

      - name: Check /analyze-repo template coverage
        # Every template must be offered by the bootstrap command or excluded on
        # the record. A bootstrap that omits templates looks like one that worked.
        run: node scripts/check-analyze-repo-coverage.mjs
