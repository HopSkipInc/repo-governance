# template: workflows/graphify-report.yml v1.1.0 · updated 2026-08-07
name: System Map (graphify)

# Kind: GENERATOR — produces committed artifacts, never blocks merges.
# Runs on push to the default branch; extraction is incremental after the first run
# (graphify-out/manifest.json is committed), so steady-state cost is seconds.
# Governing policy: docs/system-map.md (installed from templates/system-map.md).
#
# The commit message and step summary carry node/link/community deltas — report
# mode, deliberately threshold-free. The commit log is the dataset; if a delta
# magnitude ever earns a gate, that is a ratchet-shaped decision (repo-governance
# issue 51), not a local edit.

on:
  push:
    branches: [main] # ADJUST: some repos use `master` — match your default branch
  workflow_dispatch:

permissions:
  contents: write # commits the refreshed graphify-out/ back to the default branch

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: false # serialize: the commit-back step must not race itself

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # SUPPLY CHAIN — pinned. Do not float to latest, do not bump locally.
      # The pin is managed by this template's version stamp and changes only via a
      # repo-governance downstream sync, so the estate upgrades in one move.
      # (2026-08 Shai-Hulud: the estate survived because CI installs were pinned.)
      - name: Install graphify (pinned)
        run: uv tool install 'graphifyy==0.9.35'

      # Read the committed graph BEFORE extraction — the delta baseline is git
      # history itself, no state store. graph.json is node-link format: counts
      # are .nodes and .links (there is no .edges key).
      - name: Snapshot previous map stats
        id: before
        run: |
          f=graphify-out/graph.json
          if [ -f "$f" ]; then
            {
              echo "nodes=$(jq '.nodes | length' "$f")"
              echo "links=$(jq '.links | length' "$f")"
              echo "communities=$(jq '[.nodes[].community] | unique | length' "$f")"
            } >> "$GITHUB_OUTPUT"
          else
            { echo "nodes=0"; echo "links=0"; echo "communities=0"; } >> "$GITHUB_OUTPUT"
          fi

      # Code-only extraction: tree-sitter AST, fully local, no LLM, no API keys.
      # Do NOT add model keys or drop --code-only as a local edit — semantic
      # extraction is a per-repo opt-in governed by docs/system-map.md.
      - name: Build system map
        run: graphify extract . --code-only

      # extract writes graph.json only — the human report and interactive view
      # come from cluster-only. --no-label keeps 'Community N' placeholders:
      # community naming is the one LLM call in the toolchain, and this workflow
      # carries no API keys, ever.
      - name: Generate report and interactive view
        run: graphify cluster-only . --no-label

      - name: Map delta (report mode — no thresholds)
        id: delta
        env:
          OLD_NODES: ${{ steps.before.outputs.nodes }}
          OLD_LINKS: ${{ steps.before.outputs.links }}
          OLD_COMMUNITIES: ${{ steps.before.outputs.communities }}
        run: |
          f=graphify-out/graph.json
          new_nodes=$(jq '.nodes | length' "$f")
          new_links=$(jq '.links | length' "$f")
          new_communities=$(jq '[.nodes[].community] | unique | length' "$f")
          line=$(printf 'nodes %s→%s (%+d) · links %s→%s (%+d) · communities %s→%s (%+d)' \
            "$OLD_NODES" "$new_nodes" "$((new_nodes - OLD_NODES))" \
            "$OLD_LINKS" "$new_links" "$((new_links - OLD_LINKS))" \
            "$OLD_COMMUNITIES" "$new_communities" "$((new_communities - OLD_COMMUNITIES))")
          {
            echo '### System map refresh'
            echo ''
            echo '| | nodes | links | communities |'
            echo '|---|---:|---:|---:|'
            echo "| previous | $OLD_NODES | $OLD_LINKS | $OLD_COMMUNITIES |"
            echo "| now | $new_nodes | $new_links | $new_communities |"
            echo "| Δ | $((new_nodes - OLD_NODES)) | $((new_links - OLD_LINKS)) | $((new_communities - OLD_COMMUNITIES)) |"
            echo ''
            echo 'Report mode: a big Δ is a prompt to look, not a failure.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "line=$line" >> "$GITHUB_OUTPUT"

      # BRANCH PROTECTION: if your default branch requires PRs, this push will fail.
      # Either grant the Actions bot bypass on this file pattern, or switch this step
      # to open an auto-PR (peter-evans/create-pull-request). The downstream prompt
      # walks the decision.
      - name: Commit refreshed map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          if git diff --cached --quiet; then
            echo "No map changes — nothing to commit."
          else
            git commit -m "chore: refresh system map [skip ci]" -m "${{ steps.delta.outputs.line }}"
            git push
          fi
