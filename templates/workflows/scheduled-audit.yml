# template: workflows/scheduled-audit.yml v2.0.0 · updated 2026-09-16
name: Scheduled Staleness Audit

# Kind: PROBE — monitors repo reality, never blocks merges.
# This workflow is the starting shape. If your audit later moves off GitHub Actions
# (e.g., into an in-platform scheduler), pair it with audit-deadman.yml — the source
# repo's audit died silently twice once it lost the Actions failure surface.

on:
  schedule:
    # Weekdays at 09:00 ET (14:00 UTC) — adjust to your timezone
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional context note to include in the audit brief'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required by claude-code-action for OIDC auth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # audit docs live in docs/audits/ — a flat docs/ dir gets noisy after ~10 audits,
      # and a dedicated dir lets .gitignore rules and tooling target audit docs precisely.
      # Watch for .gitignore patterns like `docs/*` that would silently block the subdirectory.
      - name: Find prior audit doc
        id: prior
        run: |
          PRIOR=$(ls docs/audits/audit-*.md 2>/dev/null | sort | tail -1 || echo "none")
          echo "path=$PRIOR" >> "$GITHUB_OUTPUT"

      # FAILS CLOSED. The domain definitions live in docs/audit-domains.md, installed
      # from repo-governance templates/audit-domains.md. Without it the agent has no
      # domain list, and an audit that invents its own is worse than no audit — it
      # produces a report that reads exactly like a real one.
      - name: Require audit domains
        run: |
          if [ ! -f docs/audit-domains.md ]; then
            echo "::error::docs/audit-domains.md is missing. Install it from repo-governance templates/audit-domains.md — the audit cannot know what to check."
            exit 1
          fi
          echo "audit domains: $(head -1 docs/audit-domains.md)"

      - name: Run staleness audit via Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run a staleness audit on this repository.

            FIRST, read `docs/audit-domains.md`. It is the single definition of what this
            audit checks: every domain, the severity scale, the P2 aging rule, and the
            finding-ID convention. Run every domain it lists, in parallel.

            Do NOT substitute a domain list of your own. If `docs/audit-domains.md` is
            missing or unreadable, stop and say so rather than proceeding — an audit that
            invents its domains produces a report indistinguishable from one that ran the
            real ones. The workflow step above this one already fails the job in that case;
            if you have somehow reached this prompt without the file, that guard has broken
            and the fact is itself the finding.

            Quote the file's version stamp (line 1) at the top of the audit document, so a
            report can be traced to the domain set that produced it.


            Prior audit: ${{ steps.prior.outputs.path }}
            ${{ github.event.inputs.notes && format('Context note: {0}', github.event.inputs.notes) || '' }}

            Severity guidance:
            - P0: actively misleading a new contributor right now, or a live regression risk
            - P1: will cost hours when discovered next sprint
            - P2: cosmetic, dead links, nice-to-have

            Output format: write docs/audits/audit-YYYY-MM-DD.md with:
            - Headline counts table (Resolved / Superseded / Carried / New / Total open per severity)
            - Resolved section (findings from prior audit now fixed, with evidence)
            - P0 / P1 / P2 sections (full body per finding with Recommended action)
            - Each finding ID: AUDIT-YYYY-MM-DD-DOMAIN-NN (DOMAIN = ADR/DOCS/CODE/BACKLOG/PDR/STALE/QUALITY/COVERAGE)
            - Carry findings forward from the prior audit if still open
            - A "Future items" section (from the watch-list sweep): watch items and PDR falsifiers with their source, date, and revisit condition — informational until the condition arrives
            - A "Close-out checklist" section: the ordered list of actions needed before this audit counts as closed
            - A "Recipe lessons" section: what this audit run itself revealed about the audit process — each lesson is a candidate DoD gate

            P2 aging rule: any P2 carried across three consecutive audits must be either
            filed as a tracked issue (and removed from the audit) or closed WONT-FIX with rationale.

            After writing the doc, stage it with `git add docs/audits/audit-*.md` and stop.
            Do not commit or push — the workflow handles that.

      - name: Check for new audit doc
        id: check
        run: |
          DATE=$(date +%Y-%m-%d)
          DOC="docs/audits/audit-${DATE}.md"
          if [ -f "$DOC" ]; then
            echo "doc=$DOC" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with audit results
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="audit/${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/audits/audit-*.md
          git commit -m "docs: staleness audit ${DATE}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "docs: staleness audit ${DATE}" \
            --body "Scheduled staleness audit — Phase 1 (read-only scan).

          Review the findings below. To remediate: check out this branch, apply dispositions (fix P0s, file issues for P1s, WONT-FIX P2s), update the audit doc inline with dispositions, and push to this same PR. See \`docs/definition-of-done.md\` → Audit remediation for the checklist." \
            --label "audit,documentation" || \
          gh pr create \
            --title "docs: staleness audit ${DATE}" \
            --body "Scheduled staleness audit — Phase 1 (read-only scan).

          Review the findings below. To remediate: check out this branch, apply dispositions (fix P0s, file issues for P1s, WONT-FIX P2s), update the audit doc inline with dispositions, and push to this same PR. See \`docs/definition-of-done.md\` → Audit remediation for the checklist."
